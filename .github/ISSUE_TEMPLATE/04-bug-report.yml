name: "🐛 Store bug / QA"
description: "Report storefront, checkout, content, or theme bugs"
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What is broken?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and relevant theme
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or non-sensitive evidence
  - type: textarea
    id: acceptance
    attributes:
      label: Verification checklist
      value: |
        - [ ] Fix reviewed
        - [ ] Reproduction steps retested
        - [ ] Mobile / desktop checked
        - [ ] Live-store result verified
